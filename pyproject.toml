[project]
name = "sphota"
version = "0.1.0"
description = "A language model build with PCNs, made with associative memory via a fast cache."
readme = "README.md"
authors = [
    { name = "Ra4ster", email = "jackrose2335@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "torch>=2.14.1",
]

[project.scripts]
sphota = "sphota:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
